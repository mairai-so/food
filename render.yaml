databases:
  - name: miar-postgres
    databaseName: miar
    user: miar
    plan: free

services:
  - type: web
    name: miar-api
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: miar-postgres
          property: connectionString
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false

  # Frontend principal do gestor.
  - type: web
    name: miar-gestor
    runtime: static
    autoDeploy: true
    buildCommand: pnpm install && VITE_API_URL=https://miar-api-deyq.onrender.com pnpm --filter @workspace/gestor run build
    staticPublishPath: ./artifacts/gestor/dist/public
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

